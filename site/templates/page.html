<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EEG for Beginners">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{site_url}}/static/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="EEG for Beginners: Two weeks, real signals. Real EEG traces in cyan and violet on a dark background.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site_url}}/static/og-image.png">
<link rel="icon" href="{{base}}static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="{{base}}static/style.css">
<link rel="stylesheet" href="{{base}}static/pygments.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
{{extra_head}}
</head>
<body class="{{body_class}}">
<div class="bg-waves" aria-hidden="true"><div class="bg-blob"></div><div class="bg-blob violet"></div></div>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="{{base}}index.html">
    <svg class="brand-mark" viewBox="0 0 40 20" aria-hidden="true"><path d="M1 10h6l2-6 3 12 3-14 3 16 3-11 2 3h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>EEG for Beginners</span>
  </a>
  <div class="search">
    <input id="search" type="search" placeholder="Search the course" autocomplete="off" aria-label="Search the course">
    <ul id="search-results" class="search-results" role="listbox" hidden></ul>
  </div>
  <a class="gh-btn" href="https://github.com/alexdni/EEG_For_Beginners" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    GitHub
  </a>
  <button class="theme-btn" type="button" aria-label="Toggle light and dark mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<div class="shell">
  <nav id="sidebar" class="sidebar" aria-label="Course">{{nav}}</nav>
  <main id="main" class="content" data-base="{{base}}">
    {{header}}
    <article class="prose">
{{body}}
    </article>
    {{pager}}
    <footer class="site-foot"><span>EEG for Beginners · a two-week onboarding course</span><span>Built from Markdown · <a href="https://github.com/alexdni/EEG_For_Beginners" target="_blank" rel="noopener">source on GitHub</a> · <a href="https://alexni.ai" target="_blank" rel="noopener">alexni.ai</a></span></footer>
  </main>
  <aside class="rail">{{toc}}</aside>
</div>
<script src="{{base}}static/site.js" defer></script>
{{extra_scripts}}
</body>
</html>
